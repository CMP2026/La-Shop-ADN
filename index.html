<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ERP La Shop ADN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1c2d;
      color: white;
    }

    header {
      background: #102a44;
      padding: 12px 15px;
      font-size: 20px;
      font-weight: bold;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header img {
      height: 45px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
    }

    .btn {
      background: #1e88e5;
      border-radius: 10px;
      padding: 25px 10px;
      text-align: center;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1976d2;
    }

    .btn:active {
      background: #1565c0;
    }
  </style>
</head>

<body>

<header>
  <img src="adn logo.png" alt="Logo ADN">
  <div>ERP — La Shop ADN</div>
</header>

<div class="menu">

  <div class="btn">👤 Clients</div>
  <div class="btn">📁 Projets</div>

  <div class="btn">🛠 Production</div>
  <div class="btn">✅ Qualité</div>

  <div class="btn">💰 Facturation</div>
  <div class="btn">📊 KPI</div>

  <div class="btn">📷 Photos</div>
  <div class="btn">⚙️ Paramètres</div>

</div>

</body>
</html>
