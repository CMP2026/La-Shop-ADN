<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ERP ADN – Gestion Production</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#071a2e;
color:white;
}

header{
background:#102a44;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
font-size:22px;
font-weight:bold;
}

header img{height:45px;}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.box{
background:linear-gradient(#183d60,#0e2842);
border-radius:12px;
padding:18px;
margin-bottom:20px;
box-shadow:0 0 10px black;
}

h2{text-align:center;}

input,select,textarea{
width:100%;
padding:12px;
border:none;
border-radius:6px;
margin:8px 0;
font-size:16px;
}

textarea{height:70px;}

.btns{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
padding:15px;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.start{background:#1976d2;}
.stop{background:#c62828;}
.admin{background:#2e7d32;}

.status,.log{
background:#061628;
padding:12px;
border-radius:6px;
margin-top:10px;
}

.ok{color:#4caf50;}

.jobline{
border-bottom:1px solid #24405f;
padding:6px;
}

</style>
</head>

<body>

<header>
<img src="adn logo.png">
ERP ADN – Production
</header>

<div class="container">

<!-- CHEF -->
<div class="box">

<h2>👨‍🏭 Chef d’équipe</h2>

<select id="chefEmp">
<option value="">Assigner employé</option>
<option>Mario</option>
<option>Nelson</option>
<option>Daniel</option>
<option>Denis</option>
<option>Martin</option>
<option>Marc</option>
</select>

<input id="desc" placeholder="Description du travail">

<input id="client" placeholder="Nom du client">

<input id="contact" placeholder="Contact client">

<input type="date" id="livraison">

<button class="admin" onclick="createJob()">➕ Créer Job</button>

<div id="jobMsg"></div>

</div>

<!-- OPERATEUR -->
<div class="box">

<h2>👷 Opérateur</h2>

<select id="emp">
<option value="">Choisir employé</option>
<option>Mario</option>
<option>Nelson</option>
<option>Daniel</option>
<option>Denis</option>
<option>Martin</option>
<option>Marc</option>
</select>

<select id="jobSelect"></select>

<div class="btns">

<button class="start" onclick="startJob()">START</button>
<button class="stop" onclick="stopJob()">STOP</button>

</div>

<div class="status" id="status">Statut : STOPPÉ</div>

</div>

<!-- SUIVI -->
<div class="box">

<h2>📞 Suivis clients</h2>

<div id="suivis"></div>

</div>

<!-- HISTORIQUE -->
<div class="box">

<h2>📋 Historique</h2>

<div id="log"></div>

</div>

</div>

<script>

let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
let compteur = Number(localStorage.getItem("compteur")) || 1;
let actif = null;

// INIT
updateJobs();
loadLog();
loadSuivis();

// CREER JOB
function createJob(){

let emp = chefEmp.value;
let d = desc.value;
let c = client.value;
let ct = contact.value;
let liv = livraison.value;

if(emp==""||d==""||c==""||ct==""||liv==""){
alert("Remplir tous les champs");
return;
}

let id="ADN-"+String(compteur).padStart(3,"0");
compteur++;

let rappel=new Date(liv);
rappel.setDate(rappel.getDate()+7);

let job={
id,emp,d,c,ct,liv,
rappel:rappel.toISOString().split("T")[0],
start:null,end:null,time:0
};

jobs.push(job);

save();

jobMsg.innerHTML="✅ "+id+" créé";

updateJobs();
loadSuivis();
}

// MAJ SELECT
function updateJobs(){

jobSelect.innerHTML="";

jobs.forEach(j=>{
if(!j.end){
let o=document.createElement("option");
o.value=j.id;
o.text=j.id+" - "+j.d;
jobSelect.appendChild(o);
}
});
}

// START
function startJob(){

let emp=empSelect();
let id=jobSelect.value;

if(!emp||!id){alert("Choisir");return;}

let j=jobs.find(x=>x.id==id);

if(j.start){alert("Déjà actif");return;}

j.start=Date.now();
actif=j;

save();

status.innerText="Statut : "+id+" en cours";
}

function empSelect(){
return document.getElementById("emp").value;
}

// STOP
function stopJob(){

if(!actif){alert("Aucun actif");return;}

let h=(Date.now()-actif.start)/3600000;

actif.time+=h;
actif.end=Date.now();

addLog(actif,h);

actif.start=null;
actif=null;

save();
updateJobs();

status.innerText="Statut : STOPPÉ";
}

// LOG
function addLog(j,h){

let log=JSON.parse(localStorage.getItem("log"))||[];

log.unshift({
id:j.id,
emp:j.emp,
desc:j.d,
client:j.c,
time:h.toFixed(2)
});

localStorage.setItem("log",JSON.stringify(log));

loadLog();
}

// HISTO
function loadLog(){

let log=JSON.parse(localStorage.getItem("log"))||[];
logDiv.innerHTML="";

log.forEach(l=>{
logDiv.innerHTML+=
"<div class='jobline ok'>✔ "+l.id+
" | "+l.emp+
" | "+l.desc+
" | "+l.time+" h</div>";
});
}

function loadSuivis(){

let today=new Date().toISOString().split("T")[0];
suivis.innerHTML="";

jobs.filter(j=>j.rappel<=today&&!j.suivi).forEach(j=>{
suivis.innerHTML+=
"<div class='jobline'>📞 "+j.c+
" ("+j.ct+") – "+j.id+"</div>";
});
}

function save(){
localStorage.setItem("jobs",JSON.stringify(jobs));
localStorage.setItem("compteur",compteur);
}

</script>

</body>
</html>
